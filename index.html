
<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Presenças – Gestão de Atividades</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f3f5f8;
      color: #222;
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
    }

    h1 { color: #174b72; }

    .painel {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
      box-shadow: 0 2px 8px #00000012;
    }

    input, select, button {
      font-size: 16px;
      padding: 12px;
      border-radius: 7px;
    }

    input, select {
      border: 1px solid #bbb;
      width: 100%;
      margin: 7px 0 14px;
      background: white;
    }

    button {
      border: 0;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .botao-principal {
      background: #176b9b;
      color: white;
      width: 100%;
    }

    .botao-sair {
      background: #777;
      color: white;
      float: right;
    }

    .participante {
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 9px;
      margin: 12px 0;
      background: #fff;
    }

    .nome {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .botoes {
      display: flex;
      gap: 8px;
    }

    .botoes button {
      flex: 1;
      color: white;
      min-width: 0;
      padding: 12px 5px;
      font-size: 14px;
    }

    .presenca { background: #218838; }
    .falta { background: #c0392b; }
    .justificada { background: #d18a00; }

    .selecionado {
      outline: 3px solid #222;
      outline-offset: 2px;
    }

    .mensagem {
      padding: 12px;
      border-radius: 7px;
      margin: 12px 0;
      display: none;
      white-space: pre-wrap;
    }

    .erro { background: #ffe0e0; color: #8b0000; }
    .sucesso { background: #dff5e4; color: #155724; }

    .pequeno { color: #666; font-size: 14px; }

    .atividade-opcao {
      display: block;
      margin: 8px 0;
    }

    .atividade-opcao input {
      width: auto;
      margin: 0 8px 0 0;
    }

    #app { display: none; }

    @media (max-width: 550px) {
      body { padding: 10px; }
      .painel { padding: 14px; }
      .botoes { gap: 5px; }
      .botoes button { font-size: 12px; padding: 12px 3px; }
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Presenças – Gestão de Atividades</h1>

  <div id="mensagem" class="mensagem"></div>

  <section id="login" class="painel">
    <h2>Entrar na aplicação</h2>

    <label for="email">Email</label>
    <input id="email" type="email" placeholder="O seu email">

    <label for="password">Palavra-passe</label>
    <input id="password" type="password" placeholder="A sua palavra-passe">

    <button id="entrar" class="botao-principal">Entrar</button>
  </section>

  <main id="app">

    <section class="painel">
      <button id="sair" class="botao-sair">Sair</button>
      <h2 id="boasVindas">Bem-vindo</h2>
      <p id="tipoConta" class="pequeno"></p>
    </section>

    <section class="painel">
      <h2>Registar presenças</h2>

      <label for="atividade">Atividade</label>
      <select id="atividade"></select>

      <label for="data">Data</label>
      <input id="data" type="date">

      <p class="pequeno">
        Escolha uma das três opções para cada participante.
        Pode voltar a alterar o registo mais tarde.
      </p>

      <div id="listaParticipantes">
        Selecione uma atividade.
      </div>
    </section>

    <section id="painelAdmin" class="painel" style="display:none">
      <h2>Adicionar participante</h2>

      <label for="nomeParticipante">Nome do participante</label>
      <input id="nomeParticipante" type="text"
             placeholder="Nome completo">

      <p><strong>Atividades a que pertence:</strong></p>
      <div id="listaAtividadesAdmin"></div>

      <button id="adicionarParticipante" class="botao-principal">
        Adicionar participante
      </button>
    </section>

  </main>
</div>

<script>
  // CONFIGURAÇÃO DO SUPABASE
  const SUPABASE_URL = "https://qkliymptliwfuqrajtuo.supabase.co";
  const SUPABASE_KEY = "sb_publishable_OenVWVbVkhzurI7PAURaAg_bA2dgA9i";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  let utilizador = null;
  let perfil = null;
  let atividades = [];
  let participantes = [];
  let registos = {};
  let atividadeAtual = null;

  const $ = id => document.getElementById(id);

  function mostrarMensagem(texto, tipo = "erro") {
    const caixa = $("mensagem");
    caixa.textContent = texto;
    caixa.className = "mensagem " + tipo;
    caixa.style.display = "block";
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function esconderMensagem() {
    $("mensagem").style.display = "none";
  }

  function hoje() {
    const agora = new Date();
    const ano = agora.getFullYear();
    const mes = String(agora.getMonth() + 1).padStart(2, "0");
    const dia = String(agora.getDate()).padStart(2, "0");
    return `${ano}-${mes}-${dia}`;
  }

  async function entrar() {
    esconderMensagem();

    const email = $("email").value.trim();
    const password = $("password").value;

    if (!email || !password) {
      mostrarMensagem("Introduza o email e a palavra-passe.");
      return;
    }

    $("entrar").disabled = true;

    try {
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) throw error;

      utilizador = data.user;

      await carregarPerfil();
      await carregarAtividades();

      $("login").style.display = "none";
      $("app").style.display = "block";
      $("boasVindas").textContent =
        "Bem-vindo" + (perfil.full_name ? ", " + perfil.full_name : "");

      $("tipoConta").textContent =
        perfil.role === "admin" ? "Administrador" : "Colaborador";

      $("painelAdmin").style.display =
        perfil.role === "admin" ? "block" : "none";

      if (perfil.role === "admin") {
        mostrarAtividadesParaAdmin();
      }

      if (atividades.length > 0) {
        $("atividade").value = atividades[0].id;
        await mudarAtividade();
      } else {
        $("listaParticipantes").textContent =
          "Não tem atividades atribuídas.";
      }

    } catch (error) {
      mostrarMensagem("Não foi possível entrar: " + error.message);
    } finally {
      $("entrar").disabled = false;
    }
  }

  async function carregarPerfil() {
    const { data, error } = await db
      .from("profiles")
      .select("*")
      .eq("id", utilizador.id)
      .single();

    if (error) throw error;
    if (!data) throw new Error("Não foi encontrado o perfil do utilizador.");

    perfil = data;
  }

  async function carregarAtividades() {
    if (perfil.role === "admin") {
      const { data, error } = await db
        .from("activities")
        .select("*")
        .eq("active", true)
        .order("name");

      if (error) throw error;
      atividades = data || [];

    } else {
      const { data, error } = await db
        .from("activity_assignments")
        .select("activity_id, activities(id, name, active)")
        .eq("user_id", utilizador.id);

      if (error) throw error;

      atividades = (data || [])
        .map(item => item.activities)
        .filter(item => item && item.active);
    }

    const seletor = $("atividade");
    seletor.innerHTML = "";

    atividades.forEach(atividade => {
      const opcao = document.createElement("option");
      opcao.value = atividade.id;
      opcao.textContent = atividade.name;
      seletor.appendChild(opcao);
    });
  }

  function mostrarAtividadesParaAdmin() {
    const caixa = $("listaAtividadesAdmin");
    caixa.innerHTML = "";

    atividades.forEach(atividade => {
      const label = document.createElement("label");
      label.className = "atividade-opcao";

      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = atividade.id;
      checkbox.className = "atividade-checkbox";

      label.appendChild(checkbox);
      label.appendChild(document.createTextNode(atividade.name));
      caixa.appendChild(label);
    });
  }

  async function mudarAtividade() {
    esconderMensagem();

    atividadeAtual = $("atividade").value;

    if (!atividadeAtual) {
      $("listaParticipantes").textContent = "Não há atividade selecionada.";
      return;
    }

    $("listaParticipantes").textContent = "A carregar participantes...";

    try {
      const { data, error } = await db
        .from("activity_participants")
        .select("participant_id, participants(id, full_name, active)")
        .eq("activity_id", atividadeAtual);

      if (error) throw error;

      participantes = (data || [])
        .map(item => item.participants)
        .filter(item => item && item.active);

      participantes.sort((a, b) =>
        a.full_name.localeCompare(b.full_name, "pt")
      );

      await carregarRegistos();
      desenharParticipantes();

    } catch (error) {
      mostrarMensagem("Erro ao carregar participantes: " + error.message);
      $("listaParticipantes").textContent =
        "Não foi possível carregar a lista.";
    }
  }

  async function carregarRegistos() {
    registos = {};

    const data = $("data").value;
    if (!data) return;

    const { data: dados, error } = await db
      .from("attendance")
      .select("*")
      .eq("activity_id", atividadeAtual)
      .eq("attendance_date", data);

    if (error) throw error;

    (dados || []).forEach(registo => {
      registos[registo.participant_id] = registo.status;
    });
  }

  function desenharParticipantes() {
    const caixa = $("listaParticipantes");
    caixa.innerHTML = "";

    if (participantes.length === 0) {
      caixa.textContent = "Não existem participantes nesta atividade.";
      return;
    }

    participantes.forEach(participante => {
      const bloco = document.createElement("div");
      bloco.className = "participante";

      const nome = document.createElement("div");
      nome.className = "nome";
      nome.textContent = participante.full_name;

      const botoes = document.createElement("div");
      botoes.className = "botoes";

      const opcoes = [
        { valor: "presenca", texto: "Presença", classe: "presenca" },
        { valor: "falta", texto: "Falta", classe: "falta" },
        {
          valor: "falta_justificada",
          texto: "Falta justificada",
          classe: "justificada"
        }
      ];

      opcoes.forEach(opcao => {
        const botao = document.createElement("button");
        botao.textContent = opcao.texto;
        botao.className = opcao.classe;

        if (registos[participante.id] === opcao.valor) {
          botao.classList.add("selecionado");
        }

        botao.addEventListener("click", () =>
          guardarPresenca(participante.id, opcao.valor, bloco)
        );

        botoes.appendChild(botao);
      });

      bloco.appendChild(nome);
      bloco.appendChild(botoes);
      caixa.appendChild(bloco);
    });
  }

  async function guardarPresenca(participanteId, estado, bloco) {
    esconderMensagem();

    const data = $("data").value;
    if (!data) {
      mostrarMensagem("Escolha uma data.");
      return;
    }

    const botoes = bloco.querySelectorAll("button");
    botoes.forEach(botao => botao.disabled = true);

    try {
      const { data: existentes, error: erroConsulta } = await db
        .from("attendance")
        .select("id")
        .eq("participant_id", participanteId)
        .eq("activity_id", atividadeAtual)
        .eq("attendance_date", data)
        .limit(1);

      if (erroConsulta) throw erroConsulta;

      const registo = {
        participant_id: participanteId,
        activity_id: atividadeAtual,
        attendance_date: data,
        status: estado,
        present: estado === "presenca",
        created_by: utilizador.id
      };

      let resultado;

      if (existentes && existentes.length > 0) {
        resultado = await db
          .from("attendance")
          .update({
            status: registo.status,
            present: registo.present,
            created_by: registo.created_by
          })
          .eq("id", existentes[0].id);
      } else {
        resultado = await db
          .from("attendance")
          .insert(registo);
      }

      if (resultado.error) throw resultado.error;

      registos[participanteId] = estado;
      desenharParticipantes();
      mostrarMensagem("Registo guardado com sucesso.", "sucesso");

    } catch (error) {
      mostrarMensagem("Não foi possível guardar: " + error.message);
      botoes.forEach(botao => botao.disabled = false);
    }
  }

  async function adicionarParticipante() {
    esconderMensagem();

    const nome = $("nomeParticipante").value.trim();

    const selecionadas = Array.from(
      document.querySelectorAll(".atividade-checkbox:checked")
    ).map(checkbox => checkbox.value);

    if (!nome) {
      mostrarMensagem("Escreva o nome do participante.");
      return;
    }

    if (selecionadas.length === 0) {
      mostrarMensagem("Selecione pelo menos uma atividade.");
      return;
    }

    $("adicionarParticipante").disabled = true;

    try {
      const { data: participante, error: erroParticipante } = await db
        .from("participants")
        .insert({ full_name: nome, active: true })
        .select()
        .single();

      if (erroParticipante) throw erroParticipante;

      const associacoes = selecionadas.map(activityId => ({
        participant_id: participante.id,
        activity_id: activityId
      }));

      const { error: erroAssociacao } = await db
        .from("activity_participants")
        .insert(associacoes);

      if (erroAssociacao) {
        throw new Error(
          "O participante foi criado, mas não foi possível associá-lo às atividades: " +
          erroAssociacao.message
        );
      }

      $("nomeParticipante").value = "";
      document.querySelectorAll(".atividade-checkbox")
        .forEach(checkbox => checkbox.checked = false);

      mostrarMensagem("Participante adicionado com sucesso.", "sucesso");

      await mudarAtividade();

    } catch (error) {
      mostrarMensagem("Erro ao adicionar participante: " + error.message);
    } finally {
      $("adicionarParticipante").disabled = false;
    }
  }

  async function sair() {
    await db.auth.signOut();
    utilizador = null;
    perfil = null;
    atividades = [];
    participantes = [];
    $("app").style.display = "none";
    $("login").style.display = "block";
    $("password").value = "";
    esconderMensagem();
  }

  $("entrar").addEventListener("click", entrar);
  $("sair").addEventListener("click", sair);
  $("atividade").addEventListener("change", mudarAtividade);
  $("data").addEventListener("change", mudarAtividade);
  $("adicionarParticipante").addEventListener("click", adicionarParticipante);

  $("data").value = hoje();
</script>

</body>
</html>
