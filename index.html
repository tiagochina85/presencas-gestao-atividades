
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#174b3b">
  <title>Presenças – Gestão de Atividades</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5f3;
      margin: 0;
      padding: 25px;
      color: #24352d;
    }
    .container {
      max-width: 520px;
      margin: 45px auto;
      background: white;
      padding: 28px;
      border-radius: 14px;
      box-shadow: 0 3px 15px #0001;
    }
    h1 { color: #174b3b; font-size: 25px; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin: 9px 0;
      border-radius: 7px;
      font-size: 16px;
    }
    input { border: 1px solid #ccc; }
    button {
      background: #174b3b;
      color: white;
      border: 0;
      cursor: pointer;
    }
    .secondary { background: #687b70; }
    #app { display: none; }
    #message { margin-top: 15px; white-space: pre-wrap; }
    .info { background: #edf5ef; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Presenças</h1>
    <p>Gestão de Atividades</p>

    <section id="login">
      <h2>Iniciar sessão</h2>
      <input id="email" type="email" placeholder="Endereço de email">
      <input id="password" type="password" placeholder="Palavra-passe">
      <button onclick="login()">Entrar</button>
    </section>

    <section id="app">
      <div class="info">
        <strong id="userName"></strong>
        <p id="userRole"></p>
      </div>
      <h2>Conta ativa</h2>
      <p>A sessão foi iniciada com sucesso.</p>
      <button class="secondary" onclick="logout()">Terminar sessão</button>
    </section>

    <div id="message"></div>
  </div>

<script>
const SUPABASE_URL = "https://qkliymptliwfuqrajtuo.supabase.co";
const SUPABASE_KEY = "sb_publishable_OenVWVbVkhzurI7PAURaAg_bA2dgA9i";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

async function login() {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const message = document.getElementById("message");

  message.textContent = "A verificar os dados...";

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = "Não foi possível entrar: " + error.message;
    return;
  }

  await showProfile(data.user);
}

async function showProfile(user) {
  const message = document.getElementById("message");

  const { data: profile, error } = await db
    .from("profiles")
    .select("full_name, role")
    .eq("id", user.id)
    .single();

  if (error || !profile) {
    message.textContent =
      "A sessão foi iniciada, mas não foi possível consultar o perfil. Contacta o administrador.";
    return;
  }

  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";

  document.getElementById("userName").textContent =
    profile.full_name || user.email;

  document.getElementById("userRole").textContent =
    profile.role === "admin" ? "Administrador" : "Colaborador";

  message.textContent = "";
}

async function logout() {
  await db.auth.signOut();
  document.getElementById("app").style.display = "none";
  document.getElementById("login").style.display = "block";
  document.getElementById("password").value = "";
  document.getElementById("message").textContent = "Sessão terminada.";
}

async function checkSession() {
  const { data } = await db.auth.getSession();

  if (data.session) {
    await showProfile(data.session.user);
  }
}

checkSession();
</script>
</body>
</html>
